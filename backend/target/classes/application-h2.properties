# H2 Database Profile for Zero-Setup Local Development
spring.datasource.url=jdbc:h2:mem:sakhi_hostel_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MSSQLServer
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Enable H2 console for easy inspection if needed
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.seed-sample-data=true

# Logging
logging.level.com.sakhi.hostel=INFO
logging.level.org.springframework.security=INFO
