# Microsoft SQL Server Production Profile
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=sakhi_hostel_db;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sakhi_user}
spring.datasource.password=${DB_PASSWORD:Sakhi@Secure2026#}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Security & Secrets
app.jwt.secret=${JWT_SECRET:9a3f2c4e6b8d1a5f7c9e0b2d4f6a8c1e3a5b7c9d1e3f5a7b9c1d3e5f7a9b1c3e}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# Logging
logging.level.com.sakhi.hostel=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
