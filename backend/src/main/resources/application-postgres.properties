# ===================================================================
# PostgreSQL Production Cloud Profile (Render, Neon, Supabase, RDS)
# ===================================================================

# Datasource Configuration (Defaults are provided; DatabaseConfig adapts DATABASE_URL if present)
spring.datasource.url=${JDBC_DATABASE_URL:${DB_URL:jdbc:postgresql://localhost:5432/sakhi_hostel_db}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Connection Pooling (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# Seed Initial Baseline Data (Warden Kranti Bhoyar, Rooms, Initial Setup)
app.seed-sample-data=true

# Security & Secrets
app.jwt.secret=${JWT_SECRET:9a3f2c4e6b8d1a5f7c9e0b2d4f6a8c1e3a5b7c9d1e3f5a7b9c1d3e5f7a9b1c3e}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# Cloud Logging
logging.level.com.sakhi.hostel=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
