# ===================================================================
# Render Blueprint Specification (Infrastructure as Code)
# Project: Sakhi Girls Hostel Management System
# Full-Stack: Spring Boot 3.3.4 (Java 21) + React 18 (Vite) + PostgreSQL
# ===================================================================
version: "1"

databases:
  # Managed PostgreSQL Database
  - name: sakhi-hostel-db
    databaseName: sakhi_hostel_db
    user: sakhi_user
    plan: free
    region: oregon

services:
  # -----------------------------------------------------------------
  # 1. Backend: Spring Boot Web Service (Dockerized Java 21 LTS)
  # -----------------------------------------------------------------
  - type: web
    name: sakhi-hostel-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /api/emergency/public
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: sakhi-hostel-db
          property: connectionString
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "86400000"
      - key: CORS_ALLOWED_ORIGINS
        value: https://sakhi-hostel-frontend.onrender.com

  # -----------------------------------------------------------------
  # 2. Frontend: React 18 Single Page Application (Static Site)
  # -----------------------------------------------------------------
  - type: web
    name: sakhi-hostel-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    region: oregon
    envVars:
      - key: VITE_API_BASE_URL
        value: https://sakhi-hostel-backend.onrender.com
    routes:
      # SPA Rewrite: Ensures client-side routing works on browser refresh
      - type: rewrite
        source: /*
        destination: /index.html
